[project]
name = "aicte-validator"
version = "0.1.0"
description = "AICTE Validation Prototype — runs on synthetic data only"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gate: tests that must pass before Phase 1 starts",
    "unit: unit tests",
    "contract: contract tests",
    "e2e: end-to-end tests",
    "adversarial: adversarial tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
